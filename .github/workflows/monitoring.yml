name: "🔧 Install Monitoring Stack"

on:
  push:
    branches: [ develop, staging, main ]
    paths:
      - 'eks/alloy/**'
      - 'eks/grafana/**'
      - 'eks/loki/**'
      - 'eks/prometheus/**'
      - '.github/workflows/monitoring.yml'
  pull_request:
    branches: [ develop, staging, main ]
    paths:
      - 'eks/alloy/**'
      - 'eks/grafana/**'
      - 'eks/loki/**'
      - 'eks/prometheus/**'
      - '.github/workflows/monitoring.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [ DEV, STG, PRD ]
        default: DEV
      service:
        description: "Which service to deploy"
        required: true
        type: choice
        options:
          - all
          - alloy
          - grafana
          - loki
          - prometheus

jobs:
  changes:
    name: "🔍 Detect changes"
    runs-on: ubuntu-latest
    outputs:
      alloy:  ${{ steps.filter.outputs.alloy }}
      grafana: ${{ steps.filter.outputs.grafana }}
      loki: ${{ steps.filter.outputs.loki }}
      prometheus: ${{ steps.filter.outputs.prometheus }}
    steps:
      - name: 📥 Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ENV=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              develop) echo "ENV=DEV"  >> "$GITHUB_OUTPUT" ;;
              staging)  echo "ENV=STG"  >> "$GITHUB_OUTPUT" ;;
              main)     echo "ENV=PRD" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: 🔍 Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            alloy:
              - 'eks/alloy/**'
            grafana:
              - 'eks/grafana/**'
            loki:
              - 'eks/loki/**'
            prometheus:
              - 'eks/prometheus/**'

  install-grafana:
    name: "📦 Install grafana"
    needs: changes
    runs-on: [self-hosted, eks, private]
    env:
      AWS_REGION: "us-east-1"
      NAMESPACE: "monitoring"
    if: |
      needs.changes.outputs.grafana == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'grafana'))
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', needs.changes.outputs.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', needs.changes.outputs.environment)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', needs.changes.outputs.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: 🔧 Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets[format('EKS_CLUSTER_NAME_{0}', needs.changes.outputs.environment)] }}

      - name: 🔍 Verify Connection & Deploy
        run: |
          kubectl get nodes

      - name: 🔍 Add Grafana Helm repo
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo update grafana-community

      - name: 📦 Install Grafana
        working-directory: eks/grafana
        run: |
          helm upgrade --install grafana --version 14.4.0 grafana-community/grafana --namespace ${{ env.NAMESPACE }} --create-namespace --values values.yaml

  install-alloy:
    name: "📦 Install alloy"
    needs: changes
    runs-on: [self-hosted, eks, private]
    env:
      AWS_REGION: "us-east-1"
      NAMESPACE: "monitoring"
    if: |
      needs.changes.outputs.alloy == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'alloy'))
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', needs.changes.outputs.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', needs.changes.outputs.environment)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', needs.changes.outputs.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: 🔧 Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets[format('EKS_CLUSTER_NAME_{0}', needs.changes.outputs.environment)] }}

      - name: 🔍 Verify Connection & Deploy
        run: |
          kubectl get nodes

      - name: 🔍 Add Alloy Helm repo
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update grafana

      - name: 📦 Install Alloy
        working-directory: eks/alloy
        run: |
          helm upgrade --install alloy  --version 1.13.1 grafana/alloy --namespace ${{ env.NAMESPACE }} --create-namespace --values values.yaml

  install-loki:
    name: "📦 Install loki"
    needs: changes
    runs-on: [self-hosted, eks, private]
    env:
      AWS_REGION: "us-east-1"
      NAMESPACE: "monitoring"
    if: |
      needs.changes.outputs.loki == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'loki'))
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', needs.changes.outputs.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', needs.changes.outputs.environment)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', needs.changes.outputs.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: 🔧 Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets[format('EKS_CLUSTER_NAME_{0}', needs.changes.outputs.environment)] }}

      - name: 🔍 Verify Connection & Deploy
        run: |
          kubectl get nodes

      - name: 🔍 Add Loki Helm repo
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo update grafana

      - name: 📦 Install Loki
        working-directory: eks/loki
        run: |
          helm upgrade --install loki --version 18.16.0 grafana-community/loki --namespace ${{ env.NAMESPACE }} --create-namespace --values values.yaml

  install-prometheus:
    name: "📦 Install prometheus"
    needs: changes
    runs-on: [self-hosted, eks, private]
    env:
      AWS_REGION: "us-east-1"
      NAMESPACE: "monitoring"
    if: |
      needs.changes.outputs.prometheus == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'prometheus'))
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', needs.changes.outputs.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', needs.changes.outputs.environment)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', needs.changes.outputs.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: 🔧 Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets[format('EKS_CLUSTER_NAME_{0}', needs.changes.outputs.environment)] }}

      - name: 🔍 Verify Connection & Deploy
        run: |
          kubectl get nodes

      - name: 🔍 Add Prometheus Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update grafana

      - name: 📦 Install Prometheus
        working-directory: eks/prometheus
        run: |
          helm upgrade --install prometheus --version XXXXX prometheus-community/prometheus --namespace ${{ env.NAMESPACE }} --create-namespace --values values.yaml