# Coleta centralizada para cluster local e clusters pequenos.
# Uma replica evita duplicar os logs quando Alloy usa a API do Kubernetes.

controller:
  type: deployment
  replicas: 1

rbac:
  create: true

serviceAccount:
  create: true
  automountServiceAccountToken: true

configReloader:
  enabled: false

alloy:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraPorts:
    - name: "oltp-http"
      port: 4318
      targetPort: 4318
      protocol: "TCP"
  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "application_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "keep"
          regex         = "application"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "application_pods" {
        targets    = discovery.relabel.application_pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      logging {
        level  = "warn"
        format = "logfmt"
      }
      
      otelcol.receiver.otlp "default" {
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces  = [otelcol.exporter.otlphttp.default.input]
          metrics = [otelcol.exporter.otlphttp.prometheus.input]
        }
      }

      otelcol.exporter.otlphttp "prometheus" {
        client {
          endpoint = "http://prometheus-server.monitoring.svc.cluster.local/api/v1/otlp"
          tls {
            insecure = true
            insecure_skip_verify = true
          }
        }
      }

      otelcol.exporter.otlphttp "default" {
        client {
          endpoint = "http://tempo.monitoring.svc.cluster.local:4318"
          tls {
            insecure = true
            insecure_skip_verify = true
          }
        }
      }