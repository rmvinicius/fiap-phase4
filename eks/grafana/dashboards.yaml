apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-logs-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "FIAP Phase 4"
data:
  cluster-logs.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "logs"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": false,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "legacyOptions": {
                "enabled": true
              },
              "name": "Annotations & Alerts",
              "query": {
                "datasource": {
                  "name": "grafana"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "Container/Pod Log Dashboard(Loki as DataSource)",
        "editable": true,
        "elements": {
          "panel-11": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "P982945308D3682D1"
                          },
                          "group": "loki",
                          "kind": "DataQuery",
                          "spec": {
                            "direction": "backward",
                            "editorMode": "code",
                            "expr": "sum(count_over_time({namespace=\"$namespace\", pod=~\"$pod\"} [$__interval]))",
                            "queryType": "range"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {
                    "maxDataPoints": 100
                  },
                  "transformations": []
                }
              },
              "description": "Total  Count of log lines in the specified time range",
              "id": 11,
              "links": [],
              "title": "Total  Count of logs",
              "vizConfig": {
                "group": "stat",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "mappings": [
                        {
                          "options": {
                            "match": "null",
                            "result": {
                              "color": "rgb(31, 255, 7)",
                              "text": "0"
                            }
                          },
                          "type": "special"
                        }
                      ],
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "rgb(31, 255, 7)",
                            "value": 0
                          },
                          {
                            "color": "rgb(31, 255, 7)",
                            "value": 10
                          },
                          {
                            "color": "rgb(31, 255, 7)",
                            "value": 50
                          }
                        ]
                      },
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "horizontal",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "sum"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  }
                },
                "version": "13.3.0"
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "P982945308D3682D1"
                          },
                          "group": "loki",
                          "kind": "DataQuery",
                          "spec": {
                            "direction": "backward",
                            "editorMode": "code",
                            "expr": "{namespace=\"$namespace\", container=~\"$service\", pod=~\"$pod\"} \n| detected_level =~ `$loglevel`\n|~ `(?i)$searchable_pattern`",
                            "queryType": "range"
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
