          "options": {
            "content": "## FIAP Phase 4 - Services Metrics (Pod/Container)\n\nPer-service **CPU**, **Memory**, and **Network** usage.\n\nFilter by **namespace**, **service**, and **pod**.\n\n### Data sources\n- **Requests/Limits**: `kube_pod_container_resource_*` (kube-state-metrics)\n- **Actual usage**: `container_cpu_usage_seconds_total` / `container_memory_working_set_bytes` (requires kubelet/cAdvisor scrape — see notes below)\n- **Network**: `container_network_receive_bytes_total` / `container_network_transmit_bytes_total` (requires kubelet/cAdvisor scrape)",
