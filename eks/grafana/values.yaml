replicas: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

automountServiceAccountToken: true

testFramework:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false

# Persist dashboards/users across pod restarts. Requires a storage class on EKS.
persistence:
  enabled: true
  type: pvc
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  size: 10Gi

admin:
  existingSecret: grafana-secrets
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  server:
    domain: a00b45d2da9f343b3973669f2daeddc5-1608810677.us-east-1.elb.amazonaws.com
    root_url: "%(protocol)s://%(domain)s/grafana/"
    serve_from_sub_path: true
  database:
    type: postgres
    host: rds-dev-04.ctgx7f3bj3ny.us-east-1.rds.amazonaws.com 
    name: grafana_db
    user: "$__env{GF_DATABASE_USER}"
    password: "$__env{GF_DATABASE_PASSWORD}"
    ssl_mode: require

envValueFrom:
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-secrets
      key: postgres-user
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-secrets
      key: postgres-password

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: false
      disableDelete: false
      allowUiUpdates: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: alertmanager
        type: prometheus
        access: proxy
        url: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
        jsonData:
          skipTlsVerify: true
      - name: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        jsonData:
          skipTlsVerify: true
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: 'trace_id":\s*"([a-fA-F0-9]+)'
              name: trace_id
              url: '$${__value.raw}'
              urlDisplayLabel: View Trace
              internalLink: tempo
            - datasourceUid: tempo
              matcherRegex: 'span_id":\s*"([a-fA-F0-9]+)'
              name: span_id
              url: '$${__value.raw}'
              urlDisplayLabel: View Span
              internalLink: tempo
      - name: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        jsonData:
          skipTlsVerify: true
      - name: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          skipTlsVerify: true
          tracesToLogs:
            enabled: true
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: true