replicas: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

automountServiceAccountToken: false

testFramework:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false

# Persist dashboards/users across pod restarts. Requires a storage class on EKS.
persistence:
  enabled: false
  type: pvc
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  finalizers:
    - kubernetes.io/pvc-protection

admin:
  existingSecret: grafana-secrets
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  server:
    domain: grafana.inforhost.com
    root_url: "%(protocol)s://%(domain)s/"
  database:
    type: postgres
    host: rds-dev-04.cgt20s2oysj0.us-east-1.rds.amazonaws.com:5432
    name: grafana_db
    user: "$__env{GF_DATABASE_USER}"
    password: "$__env{GF_DATABASE_PASSWORD}"
    ssl_mode: require

envValueFrom:
  GF_DATABASE_USER:
    secretKeyRef:
      name: grafana-secrets
      key: postgres-user
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-secrets
      key: postgres-password