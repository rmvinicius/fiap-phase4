# Loki standalone, persistente e privado para Docker Desktop e ambientes pequenos.
# Para EKS com alta disponibilidade, use armazenamento S3 e modo Distributed;
# veja o README antes de promover esta configuracao.

deploymentMode: Monolithic

loki:
  auth_enabled: true
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    allow_structured_metadata: true
    retention_period: 48h
    reject_old_samples: true
    reject_old_samples_max_age: 48h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "local-path"
    enableStatefulSetAutoDeletePVC: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Gi

gateway:
  enabled: true
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

read:
  enabled: false
write:
  enabled: false
backend:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

memcachedExporter:
  enabled: false

ruler:
  enabled: false

test:
  enabled: false