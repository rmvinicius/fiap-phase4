name: analytics-service
namespace: application
port: 8005
replicas: 1
resources:
  limits:
    cpu: "200m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "256Mi"
image:
  repository: 218443855829.dkr.ecr.us-east-1.amazonaws.com
  name: analytics-service
  tag: "v1.0.0-a0e73b5ed94e1b24b607f21609d66ba8346812c9-DEV"
  pullPolicy: IfNotPresent
configmap:
  PORT: "8005"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/218443855829/queue-toggle-master"
  AWS_SQS_ENDPOINT: "https://sqs.us-east-1.amazonaws.com"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  AWS_DYNAMODB_ENDPOINT: "https://dynamodb.us-east-1.amazonaws.com"
  AWS_REGION: "us-east-1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4318"
secrets:
  AWS_ACCESS_KEY_ID: QVNJQVRGWENFVzdLWkNQRUdIRFQ=
  AWS_SECRET_ACCESS_KEY: RnJyaGN0aHVaZGJRVVBnT1MxNlZWM0psdkdvMlpjS0pidmFlSXlqTA==
  AWS_SESSION_TOKEN: 
probes:
  startup:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 9
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8005"
    prometheus.io/path: "/metrics"
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8005"
  prometheus.io/path: "/metrics"
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  averageCpuUtilization: 90
  averageMemoryUtilization: 90
keda:
  enabled: true
  type: aws-sqs-queue
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 10
  queueLength: "5"
  awsRegion: "us-east-1"
  queueURL: "queue-toggle-master"
  awsAccessKeyId: QVNJQVRGWENFVzdLWkNQRUdIRFQ=
  awsSecretAccessKey: RnJyaGN0aHVaZGJRVVBnT1MxNlZWM0psdkdvMlpjS0pidmFlSXlqTA==
  awsSessionToken: 
